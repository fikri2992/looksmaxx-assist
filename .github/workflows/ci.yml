name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: npm test

  app:
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: mobile }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: mobile/package-lock.json }
      - run: npm ci
      # Typed routes are generated by Expo; skip that one generated-type complaint until the router has run once.
      - run: npx tsc --noEmit
      - run: npx expo lint
